[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "repoheart"
version = "0.8.0"
description = "The autonomous, event-driven, multi-agent heart of your GitHub repository."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "Apache-2.0" }
authors = [
    { name = "Himanshu Kumar" },
    { name = "OpenAgentHQ" },
]
keywords = ["github", "actions", "agents", "automation", "ai", "code-review"]

# Runtime dependencies are intentionally minimal for the MVP. Provider SDKs are
# optional extras so the core stays provider-agnostic and light.
dependencies = [
    "pyyaml>=6.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "ruff>=0.6",
    "mypy>=1.11",
    "types-PyYAML>=6.0",
]
# Provider SDKs live behind extras; none are required for the core to import.
claude = ["anthropic>=0.34"]
openai = ["openai>=1.40"]
# Phase 5: large-repo scaling (guarded imports — optional)
scale = ["tree-sitter>=0.21", "tree-sitter-python>=0.21"]
scale-semantic = ["numpy>=1.26"]

[project.urls]
Homepage = "https://github.com/OpenAgentHQ/repo-heart"
Repository = "https://github.com/OpenAgentHQ/repo-heart"
"Bug Tracker" = "https://github.com/OpenAgentHQ/repo-heart/issues"
Changelog = "https://github.com/OpenAgentHQ/repo-heart/blob/main/CHANGELOG.md"
PyPI = "https://pypi.org/project/repoheart/"

[project.scripts]
repoheart = "repoheart.main:main"

[tool.hatch.build.targets.wheel]
packages = ["repoheart"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.mypy]
python_version = "3.11"
strict = true
warn_unused_ignores = true
disallow_untyped_defs = true
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
